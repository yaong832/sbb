<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
	<section class="container my-3">
		<h2>추론 이력</h2>
		<a class="btn btn-primary" th:href="@{/predict/form}">새 추론 실행</a>
		<table class="table table-bordered table-hover">
		    <thead class="table-dark"><tr><th>번호</th><th>장비명</th><th>결과</th><th>위험 점수</th><th>일시</th></tr></thead>
			<tbody>    
				<tr th:each="result, loop : ${resultList}">
				    <td th:text="${loop.count}"></td>
					<td th:text="${result.equipmentName}"></td>
				    <td><a th:href="@{|/predict/result/${result.id}|}" th:text="${result.result}"></a></td>
					<td th:text="${result.riskScore}"></td>
				    <td th:text="${#temporals.format(result.predictDate, 'yyyy-MM-dd HH:mm')}"></td>
				</tr>
		    </tbody>
		</table>
	</section>
</html>
